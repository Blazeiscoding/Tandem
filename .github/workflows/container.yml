name: Container
# Building the image and starting it took half a minute of every check run,
# though only the server, what bundles it, the image's own files or the
# lockfile can break it. The web client it serves is built and checked by
# ci.yml on every pull request. The smoke test needs Docker and Node only.
on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "apps/server-cli/**"
      - "packages/server/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tests/docker-smoke.mjs"
      - ".github/workflows/container.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build -f docker/Dockerfile -t slackoss:local .
      - run: node tests/docker-smoke.mjs
