name: Container
# Building the image and starting it took half a minute of every check run,
# and it includes both the server and web client. Run it when either artifact,
# their shared dependencies, or the image's own inputs change. The smoke test
# needs Docker and Node only.
on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "apps/server-cli/**"
      - "apps/web/**"
      - "packages/server/**"
      - "packages/protocol/**"
      - "packages/client-core/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".npmrc"
      - ".pnpmfile.cjs"
      - "tsconfig.base.json"
      - "tests/docker-smoke.mjs"
      - "tests/docker-reuse.mjs"
      - "scripts/build-identity.mjs"
      - ".github/workflows/container.yml"
      - "!**/*.md"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      # Layers, the dependency stage among them, are kept in this repository's
      # Actions cache under one scope, so a run whose lockfile is unchanged
      # reuses them (REV-08). GitHub evicts the oldest past the repository's
      # cache limit, and a new lockfile replaces the stage rather than adding
      # to it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GITHUB_SHA=${{ github.sha }}
          tags: slackoss:local
          load: true
          cache-from: type=gha,scope=container-image
          cache-to: type=gha,scope=container-image,mode=max
      - run: node tests/docker-smoke.mjs
      - run: node tests/docker-reuse.mjs
      - name: Build cache size
        run: docker buildx du | tail -n 3
