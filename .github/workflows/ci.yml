name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @slackoss/web build
      - run: pnpm --filter slackoss-server build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker build -f docker/Dockerfile -t slackoss:local .
      - run: node tests/docker-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          # Long enough to look at a failure, short enough not to accumulate.
          retention-days: 7
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slackoss/desktop package --win
      # Packaging still has to succeed here, and test:desktop then launches the
      # unpacked app it produced. What is no longer kept is the installer that
      # same step writes beside it: uploading a 107 MB file on every push and
      # holding it for ninety days used most of what this repository is given
      # for artifacts, and nothing read them. A release workflow can publish
      # one deliberately when there is something to hand out.
      - run: pnpm test:desktop
