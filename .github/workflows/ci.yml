name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-and-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To list artifacts at the end. Only the clean-up job can delete them.
      actions: read
    outputs:
      leftovers: ${{ steps.leftovers.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @slackoss/web build
      # What every visit downloads stays under the size Vite warns about.
      - run: node scripts/check-web-bundle.mjs
      - run: pnpm --filter slackoss-server build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker build -f docker/Dockerfile -t slackoss:local .
      - run: node tests/docker-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          # A day to look at the failure, or less if a later run deletes it.
          retention-days: 1
      # The clean-up job below deletes what this finds. If the lookup fails, a
      # later run finds the same artifacts.
      - name: Find artifacts that earlier runs left
        id: leftovers
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq \
            "[.artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID and (.expired | not)) | .id] | join(\" \")")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slackoss/desktop package --win
      - run: node scripts/check-web-bundle.mjs apps/desktop/out/renderer
      # Packaging still has to succeed here, and test:desktop then launches the
      # unpacked app it produced. What is no longer kept is the installer that
      # same step writes beside it: uploading a 107 MB file on every push and
      # holding it for ninety days used most of what this repository is given
      # for artifacts, and nothing read them. A release workflow can publish
      # one deliberately when there is something to hand out.
      - run: pnpm test:desktop
  # Actions storage is counted for every hour an artifact exists, so each run
  # deletes what earlier runs left. Any job that starts counts as at least a
  # minute of CI time, so this one starts only when there is something to
  # delete. A pull request from a fork gets a token that cannot delete, so its
  # runs leave the deleting to a later one.
  clean-up:
    needs: [web-and-server, windows]
    if: >-
      ${{ !cancelled() && needs.web-and-server.outputs.leftovers != '' &&
      !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Another run may have deleted the same artifact a moment earlier, which
      # is not worth failing the checks over.
      - name: Delete artifacts that earlier runs left
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ needs.web-and-server.outputs.leftovers }}
        run: |
          for id in $IDS; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; then
              echo "Deleted artifact $id"
            else
              echo "::warning::Could not delete artifact $id"
            fi
          done
