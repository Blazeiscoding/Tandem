appId: dev.slackoss.desktop
productName: Gatherline
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: ../web/dist
    to: web
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
  category: Network
protocols:
  - name: Gatherline
    schemes:
      - slackoss
